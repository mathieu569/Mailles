name: Compiler Mailles pour Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Telecharger les binaires Neutralino
        run: npx --yes @neutralinojs/neu update

      - name: Compiler
        run: npx --yes @neutralinojs/neu build --release

      - name: Preparer le dossier a distribuer
        run: |
          mkdir -p dist/Mailles-Windows
          cp dist/mailles/mailles-win_x64.exe dist/Mailles-Windows/Mailles.exe
          cp dist/mailles/resources.neu dist/Mailles-Windows/resources.neu

      - uses: actions/upload-artifact@v4
        with:
          name: Mailles-Windows
          path: dist/Mailles-Windows
